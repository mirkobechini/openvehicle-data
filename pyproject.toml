[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvehicle-data"
version = "0.0.0"
description = "Open, verified vehicle brand/model/spec data: dataset, REST API and MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2", "httpx", "fastapi", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "coverage"]

[tool.setuptools]
packages = ["core", "pipeline", "pipeline.importers", "service"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["core", "pipeline", "service"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
