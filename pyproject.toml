[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvehicle-data"
version = "0.1.5"
description = "Open, verified vehicle brand/model/spec data: dataset, REST API and MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pydantic>=2,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage>=7,<8", "jsonschema>=4,<5"]

[tool.setuptools]
packages = ["core", "pipeline", "pipeline.importers", "service"]

[tool.setuptools.package-data]
"pipeline.importers" = ["*.json"]
"service" = ["site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["core", "pipeline", "service"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
