name: Data refresh

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

env:
  GH_TOKEN: ${{ github.token }}
  YEARS: "2019-2025"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install --no-deps -e .
      - id: prev
        run: |
          tag=$(gh release list --json tagName --jq '[.[] | select(.tagName | startswith("data-v"))][0].tagName')
          gh release download "$tag" -D prev
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$(python -m pipeline.refresh next "$tag")" >> "$GITHUB_OUTPUT"
      - run: python -m pipeline.build --years "$YEARS" --version "${{ steps.prev.outputs.version }}" --out dist --prev prev
      - id: chg
        run: |
          if python -m pipeline.refresh changed dist/changelog.json; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.chg.outputs.changed == 'true'
        run: python -m pipeline.refresh guard dist/manifest.json prev/manifest.json
      - if: steps.chg.outputs.changed == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dataset
          path: dist
          retention-days: 30
      - if: steps.chg.outputs.changed == 'true'
        run: |
          v="${{ steps.prev.outputs.version }}"
          tag="data-v$v"
          branch="chore/data-$v"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists: nothing to do."
            exit 0
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" dist/* --prerelease --title "Data $v" --notes-file dist/CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          python -m pipeline.refresh pin Dockerfile dist/manifest.json "$tag"
          git add Dockerfile
          git commit -m "chore(deps): Dockerfile pins data release $v"
          git push origin "$branch"
          {
            echo "Automatic monthly refresh: data release [$tag](${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag) (pre-release) and the new pin in the Dockerfile."
            echo
            cat dist/CHANGELOG.md
            echo
            echo "Built by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The guard found no table shrinking by more than 5%."
            echo
            echo "**To go live:** wait for CI (tests and the Docker build, which checks the checksum), then merge. Render deploys from \`main\` by itself; if its health check fails it keeps the previous version."
          } > body.md
          gh pr create --base main --head "$branch" --title "chore(deps): data release $v" --body-file body.md
          gh workflow run ci.yml --ref "$branch"
      - if: failure()
        run: gh issue create --title "Data refresh failed" --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
