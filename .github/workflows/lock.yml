name: Lock dependencies

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/lock.yml
      - pyproject.toml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install "pip-tools>=7.5,<8"
      - run: pip-compile --generate-hashes --strip-extras --allow-unsafe -o requirements.lock pyproject.toml
      - run: pip-compile --generate-hashes --strip-extras --allow-unsafe --extra dev -o requirements-dev.lock pyproject.toml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lock
          path: requirements*.lock
